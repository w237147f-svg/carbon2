<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360度パノラマビューアー - 移動＆クイズ機能付き</title>
  <!-- PannellumのCSSとJavaScriptを読み込む -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }
    #panorama {
      width: 100vw;
      height: 100vh;
    }
    
    /* オリジナルアイコンの設定 */
    .light-icon {
      width: 50px;
      height: 50px;
      cursor: pointer;
      background-image: url('images.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: rgba(255, 0, 0, 0.4); 
      border-radius: 50%;
    }

    /* クイズ用ポップアップ（モーダル）のスタイル */
    #quiz-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .quiz-box {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 80%;
      max-width: 500px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .quiz-box h2 {
      margin-top: 0;
      color: #2e7d32;
      font-size: 1.2rem;
    }
    .choice-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 1rem;
      color: #333;
      background-color: #f1f8e9;
      border: 2px solid #81c784;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.2s;
    }
    .choice-btn:hover { background-color: #c8e6c9; }
    #quiz-result {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
    }
    #quiz-result h3 { margin-top: 0; }
    .explanation {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #444;
    }
    .close-btn {
      display: block;
      width: 100px;
      margin: 20px auto 0;
      padding: 10px;
      text-align: center;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .close-btn:hover { background-color: #333; }
  </style>
</head>
<body>
  <!-- パノラマを表示する領域 -->
  <div id="panorama"></div>
  
  <!-- クイズ画面のHTML -->
  <div id="quiz-modal">
    <div class="quiz-box">
      <h2>💡 脱炭素クイズ（電気編）</h2>
      <p>家庭の「照明（電気）」に関して、脱炭素（CO2削減）に**最も大きな効果**がある行動は次のうちどれでしょう？</p>
      
      <div id="quiz-choices">
        <button class="choice-btn" onclick="checkAnswer(1)">1. 使っている白熱電球をLEDランプに取り替える</button>
        <button class="choice-btn" onclick="checkAnswer(2)">2. こまめにスイッチを「1秒単位」でオン・オフを繰り返す</button>
        <button class="choice-btn" onclick="checkAnswer(3)">3. 部屋の照明を、常に一番明るい設定にしておく</button>
      </div>

      <div id="quiz-result">
        <h3 id="result-title"></h3>
        <p class="explanation" id="result-explanation"></p>
        <button class="close-btn" onclick="closeQuiz()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    // Pannellumの複数シーン（移動）設定
    pannellum.viewer('panorama', {
        "default": {
            "firstScene": "room1", // 最初に表示するシーン
            "sceneFadeDuration": 1000, // 移動時のフェードアニメーションの時間（ミリ秒）
            "autoLoad": true,
            "showZoomCtrl": true,
            "hotSpotDebug": true
        },
        
        "scenes": {
            // 最初の部屋
            "room1": {
                "type": "equirectangular",
                "panorama": "76.JPG",
                "pitch": 20,
                "yaw": 0,
                "hotSpots": [
                    {
                        // クイズのアイコン
                        "pitch": 30,
                        "yaw": -45,
                        "cssClass": "light-icon",
                        "text": "クイズに挑戦！",
                        "clickHandlerFunc": openQuiz
                    },
                    {
                        // 新しい部屋への移動ボタン
                        "pitch": 0,
                        "yaw": 90,
                        "type": "scene",
                        "text": "次の部屋へ移動",
                        "sceneId": "room2"
                    }
                ]
            },
            
            // 2つ目の部屋（移動先）
            "room2": {
                "type": "equirectangular",
                /* 💡もしGitHub上の画像名が大文字なら、ここを "image2.JPG" に変更してください */
                "panorama": "image2.jpg", 
                "pitch": 0,
                "yaw": 0,
                "hotSpots": [
                    {
                        // 最初の部屋に戻るボタン
                        "pitch": 0,
                        "yaw": 180,
                        "type": "scene",
                        "text": "元の部屋に戻る",
                        "sceneId": "room1"
                    }
                ]
            }
        }
    });

    /* クイズ用のJavaScriptプログラム */
    function openQuiz() {
      document.getElementById('quiz-modal').style.display = 'flex';
      document.getElementById('quiz-choices').style.display = 'block';
      document.getElementById('quiz-result').style.display = 'none';
    }

    function checkAnswer(answerNumber) {
      document.getElementById('quiz-choices').style.display = 'none';
      const resultArea = document.getElementById('quiz-result');
      const resultTitle = document.getElementById('result-title');
      const resultExp = document.getElementById('result-explanation');
      resultArea.style.display = 'block';

      if (answerNumber === 1) {
        resultTitle.innerHTML = "<span style='color:#e53935;'>⭕ 大正解！</span>";
      } else {
        resultTitle.innerHTML = "❌ 惜しい！正解は「1」です";
      }
      resultExp.innerHTML = 
        "<strong>正解：白熱電球をLEDランプに取り替える</strong><br><br>" +
        "環境省のデータ（COOL CHOICE）によると、54Wの白熱電球を9WのLEDランプに交換するだけで、消費電力が約85%も削減されます。<br><br>" +
        "これにより、1灯あたり年間で<strong>約84kgのCO2削減</strong>につながり、電気代も年間数千円お得になります。<br><br>" +
        "不要な電気を消すことも大切ですが、生活の快適さを我慢することなく、一度の交換で長く脱炭素に貢献できるLED化は非常に有効なアクションです。";
    }

    function closeQuiz() {
      document.getElementById('quiz-modal').style.display = 'none';
    }
  </script>
</body>
</html>
