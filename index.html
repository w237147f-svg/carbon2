<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360度パノラマビューアー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #panorama {
      width: 100vw;
      height: 100vh;
    }
    
    /* アイコンの設定 */
    .light-icon {
      width: 40px;
      height: 40px;
      /* ↓ もしファイル名が違う場合はここを書き換えてください */
      background-image: url('images.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <script>
    pannellum.viewer('panorama', {
        "type": "equirectangular",
        /* ↓ パノラマ画像の大文字・小文字も確認してください */
        "panorama": "76.jpg", 
        "autoLoad": true,
        "showZoomCtrl": true,
        "hotSpotDebug": true, /* 確認用のデバッグモード */
        "hotSpots": [
            {
                "pitch": 45,
                "yaw": 10,
                "cssClass": "light-icon",
                "text": "蛍光灯"
            }
        ]
    });
  </script>
</body>
</html>
