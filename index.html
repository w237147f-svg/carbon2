<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360度パノラマビューアー</title>
  <!-- PannellumのCSSとJavaScriptを読み込む -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    /* 画面いっぱいに表示するための設定 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #panorama {
      width: 100vw;
      height: 100vh;
    }
    
    /* オリジナルアイコンの設定 */
    .light-icon {
      width: 50px;
      height: 50px;
      cursor: pointer;
      
      /* アイコン画像のファイル名 */
      background-image: url('images.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      
      /* 万が一画像が読み込めなかった時のための「赤い丸」 */
      background-color: rgba(255, 0, 0, 0.4); 
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <!-- パノラマを表示する領域 -->
  <div id="panorama"></div>
  
  <script>
    // Pannellumの起動と設定
    pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": "76.JPG",
        "autoLoad": true,
        
        /* ページを開いた直後のカメラの向き */
        "pitch": 20,
        "yaw": 0,
        
        "showZoomCtrl": true,
        "hotSpotDebug": true, /* クリックで座標を調べるモード */
        
        /* ホットスポット（アイコン）の配置 */
        "hotSpots": [
            {
                /* 💡位置を左上に調整しました */
                "pitch": 30,    /* 上下の位置（正の数で上へ移動） */
                "yaw": -80,     /* 左右の位置（マイナスの数で左へ移動） */
                "cssClass": "light-icon",
                "text": "蛍光灯"
            }
        ]
    });
  </script>
</body>
</html>
