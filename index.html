<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360度パノラマビューアー - 移動＆脱炭素クイズ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }
    #panorama {
      width: 100vw;
      height: 100vh;
    }
    
    /* オリジナルアイコンの設定 */
    .light-icon {
      width: 50px;
      height: 50px;
      cursor: pointer;
      background-image: url('images.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: rgba(255, 0, 0, 0.4); 
      border-radius: 50%;
    }

    /* クイズ用ポップアップ（モーダル）の共通スタイル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .quiz-box {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 80%;
      max-width: 500px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .quiz-box h2 {
      margin-top: 0;
      color: #2e7d32;
      font-size: 1.2rem;
    }
    .choice-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 1rem;
      color: #333;
      background-color: #f1f8e9;
      border: 2px solid #81c784;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.2s;
    }
    .choice-btn:hover { background-color: #c8e6c9; }
    .quiz-result {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
    }
    .quiz-result h3 { margin-top: 0; }
    .explanation {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #444;
    }
    .close-btn {
      display: block;
      width: 100px;
      margin: 20px auto 0;
      padding: 10px;
      text-align: center;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .close-btn:hover { background-color: #333; }
  </style>
</head>
<body>
  <!-- パノラマを表示する領域 -->
  <div id="panorama"></div>
  
  <!-- 💡1つ目の部屋：電気に関するクイズ画面 -->
  <div id="quiz-modal" class="modal-overlay">
    <div class="quiz-box">
      <h2>💡 脱炭素クイズ（電気編）</h2>
      <p>家庭の「照明（電気）」に関して、脱炭素（CO2削減）に最も大きな効果がある行動は次のうちどれでしょう？</p>
      <div id="quiz-choices">
        <button class="choice-btn" onclick="checkAnswer(1)">1. 使っている白熱電球をLEDランプに取り替える</button>
        <button class="choice-btn" onclick="checkAnswer(2)">2. こまめにスイッチを「1秒単位」でオン・オフを繰り返す</button>
        <button class="choice-btn" onclick="checkAnswer(3)">3. 部屋の照明を、常に一番明るい設定にしておく</button>
      </div>
      <div id="quiz-result" class="quiz-result">
        <h3 id="result-title"></h3>
        <p class="explanation" id="result-explanation"></p>
        <button class="close-btn" onclick="closeQuiz()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 💡2つ目の部屋：ペットボトルに関するクイズ画面 -->
  <div id="quiz2-modal" class="modal-overlay">
    <div class="quiz-box">
      <h2>♻️ 脱炭素クイズ（資源・ごみ編）</h2>
      <p>飲み終わった「空のペットボトル」の捨て方として、脱炭素（CO2削減）につながる行動は次のうちどれでしょう？</p>
      <div id="quiz2-choices">
        <button class="choice-btn" onclick="checkAnswer2(1)">1. そのまま「燃えるごみ」として捨てる</button>
        <button class="choice-btn" onclick="checkAnswer2(2)">2. ラベルとキャップを外し、中をすすいで「資源ごみ」としてリサイクルに出す</button>
        <button class="choice-btn" onclick="checkAnswer2(3)">3. 細かくつぶして「燃えるごみ」として捨てる</button>
      </div>
      <div id="quiz2-result" class="quiz-result">
        <h3 id="result2-title"></h3>
        <p class="explanation" id="result2-explanation"></p>
        <button class="close-btn" onclick="closeQuiz2()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    // Pannellumの複数シーン（移動）設定
    pannellum.viewer('panorama', {
        "default": {
            "firstScene": "room1",
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "showZoomCtrl": true,
            "hotSpotDebug": true /* クリックで座標を調べるモード */
        },
        "scenes": {
            // 最初の部屋
            "room1": {
                "type": "equirectangular",
                "panorama": "76.JPG",
                "pitch": 20,
                "yaw": 0,
                "hotSpots": [
                    {
                        "pitch": 30,
                        "yaw": -45,
                        "cssClass": "light-icon",
                        "text": "電気のクイズ！",
                        "clickHandlerFunc": openQuiz
                    },
                    {
                        "pitch": 0,
                        "yaw": 90,
                        "type": "scene",
                        "text": "次の部屋へ移動",
                        "sceneId": "room2"
                    }
                ]
            },
            
            // 2つ目の部屋
            "room2": {
                "type": "equirectangular",
                "panorama": "image2.jpg", /* GitHub上で大文字なら image2.JPG にしてください */
                "pitch": 0,
                "yaw": 0,
                "hotSpots": [
                    {
                        "pitch": 0,
                        "yaw": 180,
                        "type": "scene",
                        "text": "元の部屋に戻る",
                        "sceneId": "room1"
                    },
                    {
                        // 💡ペットボトルの位置に合わせて座標を調整してください
                        "pitch": 150,
                        "yaw": 200,
                        "cssClass": "light-icon",
                        "text": "ペットボトルのクイズ！",
                        "clickHandlerFunc": openQuiz2
                    }
                ]
            }
        }
    });

    /* --- 1つ目の部屋（電気編）の処理 --- */
    function openQuiz() {
      document.getElementById('quiz-modal').style.display = 'flex';
      document.getElementById('quiz-choices').style.display = 'block';
      document.getElementById('quiz-result').style.display = 'none';
    }
    function checkAnswer(answerNumber) {
      document.getElementById('quiz-choices').style.display = 'none';
      const resultArea = document.getElementById('quiz-result');
      const resultTitle = document.getElementById('result-title');
      const resultExp = document.getElementById('result-explanation');
      resultArea.style.display = 'block';

      if (answerNumber === 1) {
        resultTitle.innerHTML = "<span style='color:#e53935;'>⭕ 大正解！</span>";
      } else {
        resultTitle.innerHTML = "❌ 惜しい！正解は「1」です";
      }
      resultExp.innerHTML = 
        "<strong>正解：白熱電球をLEDランプに取り替える</strong><br><br>" +
        "環境省のデータ（COOL CHOICE）によると、54Wの白熱電球を9WのLEDランプに交換するだけで、消費電力が約85%も削減されます。<br>生活の快適さを我慢することなく、一度の交換で長く脱炭素に貢献できるLED化は非常に有効なアクションです。";
    }
    function closeQuiz() {
      document.getElementById('quiz-modal').style.display = 'none';
    }

    /* --- 2つ目の部屋（ペットボトル編）の処理 --- */
    function openQuiz2() {
      document.getElementById('quiz2-modal').style.display = 'flex';
      document.getElementById('quiz2-choices').style.display = 'block';
      document.getElementById('quiz2-result').style.display = 'none';
    }
    function checkAnswer2(answerNumber) {
      document.getElementById('quiz2-choices').style.display = 'none';
      const resultArea = document.getElementById('quiz2-result');
      const resultTitle = document.getElementById('result2-title');
      const resultExp = document.getElementById('result2-explanation');
      resultArea.style.display = 'block';

      if (answerNumber === 2) {
        resultTitle.innerHTML = "<span style='color:#e53935;'>⭕ 大正解！</span>";
      } else {
        resultTitle.innerHTML = "❌ 惜しい！正解は「2」です";
      }
      // デコ活データベースのデータを基にした解説
      resultExp.innerHTML = 
        "<strong>正解：ラベルとキャップを外し、中をすすいで「資源ごみ」としてリサイクルに出す</strong><br><br>" +
        "デコ活データベースによると、ペットボトルをごみとして廃棄するのではなく、「資源ごみ」としてリサイクルに出すことで、1回あたり約0.053kg-CO2eの温室効果ガス削減効果があります。<br><br>" +
        "💡<strong>さらにワンポイント！</strong><br>ペットボトル飲料を買う代わりに「マイボトル（水筒）」を持参すると、1回あたり約0.105kg-CO2eの削減になり、リサイクルの約2倍も脱炭素に貢献できます！";
    }
    function closeQuiz2() {
      document.getElementById('quiz2-modal').style.display = 'none';
    }
  </script>
</body>
</html>
