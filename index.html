<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360度パノラマビューアー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #panorama {
      width: 100vw;
      height: 100vh;
    }
    
    /* アイコンの設定 */
    .light-icon {
      width: 50px;
      height: 50px;
      cursor: pointer;
      
      /* 画像の指定 */
      background-image: url('images.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      
      /* 💡テスト用：画像が出ない場合の「赤い丸」 */
      background-color: rgba(255, 0, 0, 0.4); 
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <script>
    pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": "76.jpg", /* 大文字・小文字注意（76.JPGかも？） */
        "autoLoad": true,
        
        /* 起動時のカメラの向き（少し上向きの正面） */
        "pitch": 20,
        "yaw": 0,
        
        "showZoomCtrl": true,
        "hotSpotDebug": true, /* クリックで座標を確認するモード */
        
        "hotSpots": [
            {
                /* 起動時のカメラの向きと全く同じ場所にアイコンを置く */
                "pitch": 20,
                "yaw": 0,
                "cssClass": "light-icon",
                "text": "蛍光灯アイコン"
            }
        ]
    });
  </script>
</body>
</html>
